name: Deploy build 57 plus isolated visual-matching preview

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out this deployment repository
        uses: actions/checkout@v4

      - name: Check out scanner build 57
        uses: actions/checkout@v4
        with:
          repository: y5dk674ks8-svg/kanto151-vintage
          ref: c1b575a738b3d1006266eb177467aec2b937b5c5
          path: site

      - name: Check out isolated visual-matching prototype
        uses: actions/checkout@v4
        with:
          repository: y5dk674ks8-svg/kanto151-vintage
          ref: visual-card-matching-prototype
          path: site/preview

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
